
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blue Sky | Food Menu</title>

<style>
* { box-sizing: border-box; }

:root {
  --green: #174c3c;
  --cream: #f7f7f2;
  --orange: #f2a541;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: var(--cream);
  color: #202820;
}

header {
  background: var(--green);
  color: white;
  padding: 25px 18px;
  border-radius: 0 0 24px 24px;
}

.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}

.logo { font-size: 22px; font-weight: bold; }

.cart-top {
  background: white;
  color: var(--green);
  border: none;
  border-radius: 20px;
  padding: 11px 14px;
  font-weight: bold;
}

header p { color: #d9e7df; }

main {
  max-width: 760px;
  padding: 18px;
  margin: auto;
}

h2 { margin-bottom: 12px; }

.search {
  width: 100%;
  padding: 14px;
  border: 1px solid #ddd;
  border-radius: 12px;
  font-size: 16px;
  margin: 10px 0 16px;
}

.categories {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 15px;
}

.categories button {
  padding: 10px 16px;
  border: 0;
  border-radius: 22px;
  white-space: nowrap;
  background: #e7e9e2;
  color: var(--green);
}

.categories button.active {
  background: var(--green);
  color: white;
}

.grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 13px;
}

.food {
  background: white;
  border-radius: 15px;
  padding: 10px;
  box-shadow: 0 3px 12px #0000000a;
  min-width: 0;
}

.food img {
  width: 100%;
  height: 115px;
  object-fit: cover;
  border-radius: 10px;
  background: #e5e9e1;
}

.food h3 {
  font-size: 15px;
  margin: 10px 0 5px;
}

.food p {
  color: #72786f;
  font-size: 12px;
  min-height: 28px;
  margin: 0 0 8px;
}

.price {
  color: var(--green);
  font-weight: bold;
  font-size: 15px;
}

.add {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
  border: none;
  border-radius: 9px;
  background: var(--green);
  color: white;
  font-weight: bold;
}

.panel {
  background: white;
  border-radius: 16px;
  padding: 16px;
  margin-top: 24px;
  box-shadow: 0 3px 12px #0000000a;
}

.cart-item {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  padding: 12px 0;
  border-bottom: 1px solid #eee;
}

.qty {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 7px;
}

.qty button {
  border: none;
  border-radius: 7px;
  padding: 5px 10px;
  background: #e7e9e2;
}

.total {
  display: flex;
  justify-content: space-between;
  font-size: 18px;
  font-weight: bold;
  margin: 18px 0;
}

.checkout {
  width: 100%;
  padding: 14px;
  background: var(--orange);
  border: none;
  border-radius: 10px;
  font-weight: bold;
  font-size: 16px;
}

#message {
  line-height: 1.6;
  overflow-wrap: anywhere;
}

footer {
  text-align: center;
  padding: 25px;
  color: #777;
  font-size: 13px;
}

@media (max-width: 350px) {
  main { padding: 12px; }
  .grid { gap: 8px; }
  .food { padding: 7px; }
}
</style>
</head>

<body>

<header>
  <div class="top">
    <div class="logo">🍃 Blue Sky</div>
    <button class="cart-top"
      onclick="goToCart()">
      🛒 Cart (<span id="cartCount">0</span>)
    </button>
  </div>
  <h1>Delicious moments.</h1>
  <p>Fresh food, made with care.</p>
</header>

<main>
  <h2>Explore our menu</h2>

  <input class="search" id="search"
    placeholder="Search food..."
    oninput="renderMenu()">

  <div class="categories" id="categories">
    <button class="active"
      onclick="setCategory('All',this)">All</button>
    <button onclick="setCategory('Meals',this)">Meals</button>
    <button onclick="setCategory('Pizza',this)">Pizza</button>
    <button onclick="setCategory('Drinks',this)">Drinks</button>
  </div>

  <div class="grid" id="menu"></div>

  <section class="panel" id="cart">
    <h2>🛒 Your cart</h2>
    <div id="cartItems">Your cart is empty.</div>

    <div class="total">
      <span>Total</span>
      <span id="total">0 ETB</span>
    </div>

    <label for="tableNumber">Table number</label>
    <input class="search" id="tableNumber"
      placeholder="e.g. 5">

    <button class="checkout" onclick="placeOrder()">
      Confirm order
    </button>

    <p id="message" role="status"></p>
  </section>
</main>

<footer>
  Blue Sky Hotel · Thank you for visiting!
</footer>

<script>
const products = [
  {
    id: 1, name: "Special Breakfast",
    category: "Meals", price: 180,
    description: "Egg, bread and tea",
    image: "https://images.unsplash.com/photo-1533089860892-a7c6f0a88666?auto=format&fit=crop&w=500&q=80"
  },
  {
    id: 2, name: "Chicken Burger",
    category: "Meals", price: 280,
    description: "Chicken burger and vegetables",
    image: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=500&q=80"
  },
  {
    id: 3, name: "Cheese Pizza",
    category: "Pizza", price: 450,
    description: "Cheese and fresh toppings",
    image: "https://images.unsplash.com/photo-1513104890138-7c749659a591?auto=format&fit=crop&w=500&q=80"
  },
  {
    id: 4, name: "French Fries",
    category: "Meals", price: 150,
    description: "Crispy golden potatoes",
    image: "https://images.unsplash.com/photo-1573080496219-bb080dd4f877?auto=format&fit=crop&w=500&q=80"
  },
  {
    id: 5, name: "Fresh Juice",
    category: "Drinks", price: 100,
    description: "Fresh fruit juice",
    image: "https://images.unsplash.com/photo-1600271886742-f049cd451bba?auto=format&fit=crop&w=500&q=80"
  },
  {
    id: 6, name: "Coffee",
    category: "Drinks", price: 50,
    description: "Fresh Ethiopian coffee",
    image: "https://images.unsplash.com/photo-1509042239860-f550ce710b93?auto=format&fit=crop&w=500&q=80"
  }
];

let category = "All";
let cart = {};

function setCategory(value, button) {
  category = value;

  document.querySelectorAll(".categories button")
    .forEach(b => b.classList.remove("active"));

  button.classList.add("active");
  renderMenu();
}

function renderMenu() {
  const query = document.getElementById("search")
    .value.toLowerCase().trim();

  const list = products.filter(p =>
    (category === "All" || p.category === category) &&
    p.name.toLowerCase().includes(query)
  );

  document.getElementById("menu").innerHTML =
    list.map(p => `
      <article class="food">
        <img src="${p.image}" alt="${p.name}"
          loading="lazy">
        <h3>${p.name}</h3>
        <p>${p.description}</p>
        <div class="price">${p.price} ETB</div>
        <button class="add"
          onclick="addToCart(${p.id})">
          + Add to cart
        </button>
      </article>
    `).join("") || "<p>No food found.</p>";
}

function addToCart(id) {
  cart[id] = (cart[id] || 0) + 1;
  renderCart();
}

function changeQty(id, amount) {
  cart[id] = (cart[id] || 0) + amount;

  if (cart[id] <= 0) delete cart[id];

  renderCart();
}

function renderCart() {
  const entries = Object.entries(cart);
  const count = entries.reduce((sum, entry) =>
    sum + entry[1], 0);

  const total = entries.reduce((sum, entry) => {
    const product = products.find(p =>
      p.id === Number(entry[0]));
    return sum + product.price * entry[1];
  }, 0);

  document.getElementById("cartCount").textContent = count;
  document.getElementById("total").textContent =
    total + " ETB";

  document.getElementById("cartItems").innerHTML =
    entries.length ? entries.map(([id, qty]) => {
      const p = products.find(x => x.id === Number(id));

      return `
        <div class="cart-item">
          <div>
            <strong>${p.name}</strong><br>
            ${p.price * qty} ETB
            <div class="qty">
              <button onclick="changeQty(${p.id},-1)">−</button>
              <span>${qty}</span>
              <button onclick="changeQty(${p.id},1)">+</button>
            </div>
          </div>
          <span>${qty} × ${p.price}</span>
        </div>
      `;
    }).join("") : "Your cart is empty.";

  return total;
}

function goToCart() {
  document.getElementById("cart").scrollIntoView({
    behavior: "smooth"
  });
}

function placeOrder() {
  const entries = Object.entries(cart);
  const table = document.getElementById("tableNumber")
    .value.trim();
  const message = document.getElementById("message");

  if (!entries.length) {
    message.textContent = "Please add food to your cart.";
    return;
  }

  if (!table) {
    message.textContent = "Please enter your table number.";
    return;
  }

  const summary = entries.map(([id, qty]) => {
    const p = products.find(x => x.id === Number(id));
    return `${p.name} x ${qty}`;
  }).join(", ");

  message.textContent =
    "Demo order prepared! Table " + table +
    ". Items: " + summary +
    ". Total: " + renderCart() +
    " ETB. Connect an order service to send this to the hotel.";

}

renderMenu();
renderCart();
</script>

</body>
</html>
